name: Cut Release

# Manually triggered from the Actions tab: type a version number, click Run, and
# this bumps package.json, commits it, tags it, and pushes both. The push of the
# vX.Y.Z tag then triggers build.yml's existing tag-triggered `release` job
# automatically — this workflow only ever creates the tag, it doesn't build or
# publish anything itself.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (no leading v)"
        required: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be in the form X.Y.Z (got '${{ inputs.version }}')"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version, commit, and tag
        run: pnpm version "${{ inputs.version }}" --message "Release v%s"

      - name: Push commit and tag
        run: |
          git push origin HEAD:main
          git push origin "v${{ inputs.version }}"
