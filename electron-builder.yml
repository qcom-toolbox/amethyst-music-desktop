appId: com.amethystmusic.desktop
productName: Amethyst Music
copyright: Copyright © qcom-toolbox

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - build/icon.png
  - build/icon-macos-tahoe.png
  - package.json

# No code-signing certificates are configured. Built apps will show an
# "unidentified developer" warning on macOS and a SmartScreen prompt on
# Windows until signing is set up (see README.md).
mac:
  category: public.app-category.music
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Audio
